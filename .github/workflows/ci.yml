name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "50 13 * * 1"   # weekly: catch dependency drift
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q
